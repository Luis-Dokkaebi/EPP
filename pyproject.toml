[tool.pytest.ini_options]
testpaths = ["tests", "features"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
timeout = 60
markers = [
    "unit: prueba unitaria rápida sin I/O real (se asigna sola si no hay otro marcador)",
    "bdd: escenario Gherkin de features/",
    "integration: I/O real acotado a tmp_path o localhost",
    "slow: más de un segundo; fuera del hook rápido",
    "windows: requiere Windows (se deselecciona en Linux)",
]

[tool.coverage.run]
branch = true
source = ["src"]
# Mide también los scripts que las pruebas ejecutan como subproceso (bloques __main__).
patch = ["subprocess"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
files = [
    "src",
    "scripts/check_*.py",
    "scripts/ejecutar_pruebas_mutacion.py",
    "tools/*.py",
    ".claude/hooks/guardian.py",
]

[[tool.mypy.overrides]]
# Librerías de terceros sin anotaciones de tipos publicadas (no es un waiver).
module = [
    "customtkinter.*",
    "face_recognition.*",
    "onnxruntime.*",
    "pandas.*",
    "radon.*",
    "reportlab.*",
    "seaborn.*",
    "shapely.*",
    "supervision.*",
    "tkcalendar.*",
    "torch.*",
    "ultralytics.*",
    "wmi",
]
ignore_missing_imports = true

# WAIVER-#4 (caduca 2027-01-19): módulos heredados sin anotar. Cada override desactiva solo
# los códigos que hoy incumple el módulo; al tocarlo se anota y se borra su bloque.

