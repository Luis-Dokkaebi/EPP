# Quality Gate de CLAUDE.md §10 en CI (SPEC/9 §0.8). Los mismos scripts que corre el agente en
# local: scripts/quality_gate.sh (Linux) y scripts/quality_gate.ps1 (Windows).
name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # nocturno: mutación de los módulos críticos (§7)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # En un PR se compara contra su rama base; en main y de noche, contra el commit anterior.
  GATE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
  GATE_REPORTES: reports/gate
  PYTHONUTF8: "1"

jobs:
  gate:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dependencias
        run: python -m pip install -r requirements-ci.txt -r requirements-dev.txt
      - name: Xvfb para la GUI heredada (Tk)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb
      - name: Quality Gate (Linux)
        if: runner.os == 'Linux'
        run: scripts/quality_gate.sh --sin-instalar --sin-mutacion
      - name: Quality Gate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/quality_gate.ps1 -SinInstalar -SinMutacion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-${{ matrix.os }}
          path: |
            reports/gate/
            coverage.xml

  mutacion:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dependencias
        run: |
          python -m pip install -r requirements-ci.txt -r requirements-dev.txt
          sudo apt-get install -y xvfb
      - name: Mutación de lo cambiado en el PR (umbral 85 %)
        if: github.event_name == 'pull_request'
        run: scripts/quality_gate.sh --sin-instalar --changed
      - name: Mutación de los módulos críticos (umbral 90 %)
        if: github.event_name != 'pull_request'
        run: scripts/quality_gate.sh --sin-instalar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutacion
          path: reports/gate/

  licencias:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # WAIVER-#18 (W-011): en rojo por diseño hasta cerrar AC-001 (ultralytics AGPL, tkcalendar
    # GPL, pesos .pt AGPL). Reporta sin bloquear el merge; vence el 2027-01-20.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Entorno limpio con solo requirements.txt
        # El índice CPU de PyTorch reproduce el torch del ejecutable de Windows (sin CUDA).
        run: |
          python -m venv .venv-licencias
          .venv-licencias/bin/python -m pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Gate de licencias
        shell: bash # explícito: activa pipefail y `| tee` no oculta el código de salida
        run: |
          python -m pip install pip-licenses==5.5.5
          mkdir -p reports/licencias
          pip-licenses --python .venv-licencias/bin/python --from=mixed --format=json \
            > reports/licencias/paquetes.json
          python scripts/check_licenses.py --paquetes reports/licencias/paquetes.json \
            | tee reports/licencias/veredicto.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licencias
          path: reports/licencias/
